# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  UNICODE_VERSION: latest
  NODE_ENV: production
  VITE_UNICODE_BASE_URL: ./ucd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Unicode data
        run: |
          mkdir -p public/ucd
          curl -o "$RUNNER_TEMP/ucd.zip" -L "https://www.unicode.org/Public/${{ env.UNICODE_VERSION }}/ucd/UCD.zip"
          unzip "$RUNNER_TEMP/ucd.zip" -d public/ucd

      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      #- run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/

  publish-site:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Dispatch elie-g event
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SITE_TOKEN }}
          repository: elie-g/elie-g.github.io
          event-type: publish
